<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Report</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

/* Cards */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:25px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    transition:.3s;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-5px);
}

.card h3{
    font-size:38px;
    margin-bottom:10px;
}

.card p{
    color:#666;
    font-size:16px;
}

.total{
    border-left:6px solid #0d6efd;
}

.total h3{
    color:#0d6efd;
}

.present{
    border-left:6px solid #198754;
}

.present h3{
    color:#198754;
}

.checkout{
    border-left:6px solid #fd7e14;
}

.checkout h3{
    color:#fd7e14;
}

.pending{
    border-left:6px solid #dc3545;
}

.pending h3{
    color:#dc3545;
}

/* Table */

.table-container{
    background:#fff;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    overflow:hidden;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#0d6efd;
    color:white;
}

th{
    padding:15px;
}

td{
    padding:14px;
    text-align:center;
    border-bottom:1px solid #eee;
}

tbody tr:hover{
    background:#f8f9fa;
}

.status-present{
    color:#198754;
    font-weight:bold;
}

.status-absent{
    color:#dc3545;
    font-weight:bold;
}

.status-late{
    color:#fd7e14;
    font-weight:bold;
}

/* Responsive */

@media(max-width:900px){

    body{
        padding:15px;
    }

    table{
        font-size:14px;
    }

}
.toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

#searchInput{
    width:350px;
    padding:12px 15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

#searchInput:focus{
    border-color:#0d6efd;
}
.date-filter{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.date-filter input{
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

.date-filter button{
    padding:10px 18px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    color:white;
}

#filterBtn{
    background:#0d6efd;
}

#resetBtn{
    background:#dc3545;
}

#filterBtn:hover{
    background:#0b5ed7;
}

#resetBtn:hover{
    background:#bb2d3b;
}
/* Status Badges */

.badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    color:#fff;
    min-width:90px;
}

.badge-present{
    background:#198754;
}

.badge-late{
    background:#fd7e14;
}

.badge-absent{
    background:#dc3545;
}

.badge-pending{
    background:#6c757d;
}

.badge-completed{
    background:#0d6efd;
}
/* Report Header */

.report-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    flex-wrap:wrap;
}

.report-header h1{
    margin:0;
    color:#333;
}

.report-header p{
    color:#666;
    margin-top:5px;
}

.header-buttons{
    display:flex;
    gap:10px;
}

.header-buttons button{
    background:#0d6efd;
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    transition:.3s;
}

.header-buttons button:hover{
    background:#0b5ed7;
}
</style>

</head>

<body>

<div class="report-header">

    <div>
        <h1>Attendance Report</h1>
        <p>Employee Attendance Management System</p>
    </div>

    <div class="header-buttons">

        <button onclick="window.location.href='/dashboard'">
            🏠 Dashboard
        </button>

        <button onclick="window.print()">
            🖨 Print
        </button>

    </div>

</div>

<div class="cards">

    <div class="card total">
        <h3 id="totalRecords">0</h3>
        <p>Total Records</p>
    </div>

    <div class="card present">
        <h3 id="presentCount">0</h3>
        <p>Present</p>
    </div>

    <div class="card checkout">
        <h3 id="checkedOutCount">0</h3>
        <p>Checked Out</p>
    </div>

    <div class="card pending">
        <h3 id="pendingCount">0</h3>
        <p>Pending Check-Out</p>
    </div>

</div>
<div class="toolbar">

    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search by Employee Code or Name..."
    >

    <div class="date-filter">

        <label>From</label>
        <input type="date" id="fromDate">

        <label>To</label>
        <input type="date" id="toDate">

        <button id="filterBtn">Filter</button>
        <button id="resetBtn">Reset</button>

    </div>

</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>Employee Code</th>

<th>Name</th>

<th>Department</th>

<th>Date</th>

<th>Check In</th>

<th>Check Out</th>

<th>Status</th>

</tr>

</thead>

<tbody id="attendanceTable">

</tbody>

</table>

</div>

<script src="/js/attendance-report.js"></script>

</body>
</html>
