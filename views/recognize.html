<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Recognition</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#f4f4f4;
    font-family:Arial,sans-serif;
    text-align:center;
}
.main-container{

    display:flex;

    justify-content:center;

    align-items:flex-start;

    gap:40px;

    margin-top:30px;

    flex-wrap:wrap;

}
h2{
    margin-bottom:20px;
}

#camera-container{
    position:relative;
    display:inline-block;
}

video{

    width:720px;
    max-width:100%;

    border:4px solid #0d6efd;

    border-radius:12px;

    background:black;

}

canvas{
    position:absolute;
    left:0;
    top:0;
}
.attendance-card{

    width:340px;

    background:white;

    border-radius:15px;

    padding:25px;

    box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.employee-photo{
    text-align:center;
    margin-bottom:20px;
}

.employee-photo img{

    width:140px;
    height:140px;

    border-radius:50%;

    object-fit:cover;

    border:5px solid #0d6efd;
}

.employee-info p{

    font-size:18px;
    margin:10px 0;

}

.status{

    margin-top:25px;

    padding:15px;

    border-radius:10px;

    font-size:20px;

    font-weight:bold;

    transition:.3s;

}

.waiting{

    background:#fff3cd;
    color:#856404;

}

.success{

    background:#d1e7dd;
    color:#0f5132;

}

.checkout{

    background:#cfe2ff;
    color:#084298;

}

.error{

    background:#f8d7da;
    color:#842029;
}
.header-buttons{
    display:flex;
    gap:10px;
}

.header-buttons button{
    background:#0d6efd;
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    transition:.3s;
}

.header-buttons button:hover{
    background:#0b5ed7;
}
</style>

</head>
<body>
    <div class="header-buttons">

        <button onclick="window.location.href='/dashboard'">
            🏠 Dashboard
        </button></div>

<h2>Employee Face Recognition</h2>

<div class="main-container">

    <div id="camera-container">
        <video id="video" autoplay muted playsinline></video>
    </div>

    <div class="attendance-card">

    <h2>Attendance Status</h2>

    <div class="employee-photo">
        <img id="empPhoto"
     src="/uploads/default-avatar.png"
     alt="Employee">
    </div>

    <div class="employee-info">
        <p><strong>Name:</strong> <span id="empName">--</span></p>
        <p><strong>Employee Code:</strong> <span id="empCode">--</span></p>
        <p><strong>Department:</strong> <span id="empDept">--</span></p>
        <p><strong>Designation:</strong> <span id="empDesignation">--</span></p>
        <p><strong>Time:</strong> <span id="attendanceTime">--</span></p>
    </div>

    <div id="attendanceStatus" class="status waiting">
        Waiting for face...
    </div>

</div></div>

<script src="/face-api/face-api.js"></script>
<script src="/js/recognize.js"></script>

</body>
</html>
